version: v2
modules:
  - path: event
  - path: organization
lint:
  use:
    - STANDARD
  except:
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
  ignore_only:
    ENUM_VALUE_PREFIX:
      - event/event/v1/rbac.proto
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
