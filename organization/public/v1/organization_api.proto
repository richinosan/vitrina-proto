syntax = "proto3";

package organization.public.v1;

import "organization/public/v1/organization.proto";

// GetOrganizationRequest は公開 Organization を取得する。
message GetOrganizationRequest {
  // name は organizations/{id} 形式。
  string name = 1;
}

// ListOrganizationsRequest は公開 Organization 一覧を取得する。
message ListOrganizationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListOrganizationsResponse {
  repeated PublicOrganization organizations = 1;
  string next_page_token = 2;
}

// PublicOrganizationService は read-oriented な公開 Organization API。
service PublicOrganizationService {
  rpc GetOrganization(GetOrganizationRequest) returns (PublicOrganization);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
}
