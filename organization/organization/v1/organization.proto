syntax = "proto3";

package organization.v1;

// Organization は Organization リソースの公開表現。
message Organization {
  string id = 1;
  string schema_type = 2;
  string name = 3;
  string description = 4;
  string image = 5;
  string url = 6;
  // schema_api_published が true の場合、
  // /v1/schema.org/organization/{id} で schema.org 準拠の JSON-LD を公開する。
  bool schema_api_published = 7;
}
