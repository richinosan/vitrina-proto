syntax = "proto3";

package vitrina.v1;

// PublicEvent は公開 Event 表現。
message PublicEvent {
  string id = 1;
  string schema_type = 2;
  string name = 3;
  string description = 4;
  string start_date = 5;
  string end_date = 6;
  string location_json = 7;
  string event_attendance_mode = 8;
  string event_status = 9;
  string image = 10;
  string url = 11;
  string organizer_json = 12;
  PublicEventSummary parent = 13;
  repeated PublicEventSummary children = 14;
}

// PublicEventSummary は親子関係の 1 階層埋め込み用。
message PublicEventSummary {
  string id = 1;
  string schema_type = 2;
  string name = 3;
  string description = 4;
  string start_date = 5;
  string end_date = 6;
  string location_json = 7;
  string event_attendance_mode = 8;
  string event_status = 9;
  string image = 10;
  string url = 11;
  string organizer_json = 12;
}
